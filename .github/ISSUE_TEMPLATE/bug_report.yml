name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can, so we can reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran (e.g. `fks create --name x ...`) or what you asked your AI agent.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the relevant output or error message.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: "`fks doctor` output"
      render: text
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How did you run it?
      options:
        - fks CLI
        - Claude Code
        - Cursor
        - Windsurf
        - Antigravity
        - Codex
        - Gemini CLI
        - GitHub Copilot
        - scaffold.py directly
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11...
