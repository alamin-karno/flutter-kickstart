name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Scripts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python -m py_compile bin/flutter-kickstart skills/flutter-kickstart/scripts/*.py

      - name: Check shell installer syntax
        run: bash -n install.sh

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json, re, sys
          plugin = json.load(open(".claude-plugin/plugin.json"))
          json.load(open(".claude-plugin/marketplace.json"))
          version = plugin.get("version", "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"plugin.json version '{version}' is not x.y.z")
          print(f"plugin.json version {version}")
          PY

      - name: Smoke-test the CLI and generator
        run: |
          python bin/flutter-kickstart --help
          for state in bloc riverpod; do
            for network in viva dio; do
              python skills/flutter-kickstart/scripts/scaffold.py --dry-run \
                --name demo_${state}_${network} --org com.acme --state $state --network $network \
                --features orders --locales en,bn --crash sentry --ci github
            done
          done
          for router in go_router auto_route navigator; do
            python skills/flutter-kickstart/scripts/scaffold.py --dry-run \
              --name demo_${router} --org com.acme --state bloc --router $router --ci none
          done

  docs:
    # Always reports a result (it's a required check), but only builds the
    # site when something under website/ or this workflow changed.
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the docs change?
        id: site
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=false
          if [ ! -f website/package.json ]; then
            echo "No website/ yet."
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            build=true
          elif git diff --name-only "$BASE" HEAD -- website .claude-plugin/plugin.json .github/workflows/ci.yml | grep -q .; then
            build=true
          else
            echo "Nothing under website/ changed; skipping the build."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.site.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: steps.site.outputs.build == 'true'
        run: npm ci
      - if: steps.site.outputs.build == 'true'
        run: npm run build
