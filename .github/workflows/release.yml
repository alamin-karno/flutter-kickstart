name: Release

# Push a vX.Y.Z tag on main to publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches plugin.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin_version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "$version" != "$plugin_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $plugin_version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release from main only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Add install instructions for this exact version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}"
          cat >> notes.md <<EOF

          ## Install this version

          macOS / Linux:

          \`\`\`bash
          curl -fsSL ${raw}/install.sh | FLUTTER_KICKSTART_BRANCH=${TAG} bash
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          \$env:FLUTTER_KICKSTART_BRANCH = "${TAG}"; irm ${raw}/install.ps1 | iex
          \`\`\`

          To always track the latest release instead, use the commands in the [installation guide](https://alamin-karno.github.io/flutter-kickstart/guide/installation).
          EOF
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flutter Kickstart $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            --latest \
            install.sh install.ps1
