version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /website
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: docs
